config_version = 15

[bar.default]
color = "#f2f2f2"
icon_color = "#505a60"
capsule_foreground = "#f2f2f2"
border = "#505a60"
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "brightness", "battery", "volume" ]
margin_ends = 0
padding = 0
start = [ "workspaces" ]
thickness = 22

[dock]
enabled = true
icon_size = 32
launcher_position = "start"
reserve_space = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_colorize = true
app_icon_color = "#f2f2f2"
polkit_agent = true

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    default_view = "pinned"
    pinned = [ "firefox", "org.alacritty.Alacritty", "org.gnome.Nautilus", "org.gnome.TextEditor" ]

    [shell.panel]
    open_near_click_control_center = true

[theme]
custom_palette = "Matrix-Verde-Medio"
builtin = "Catppuccin"
community_palette = "GitHub Dark"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-monochrome"

[wallpaper.default]
path = "@@HOME@@/Imagens/Papeis-de-parede/via-lactea-matrix.png"

[wallpaper.last]
path = "@@HOME@@/Imagens/Papeis-de-parede/via-lactea-matrix.png"

[wallpaper.monitors.eDP-1]
path = "@@HOME@@/Imagens/Papeis-de-parede/via-lactea-matrix.png"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.launcher]
glyph = "menu"

[widget.media]
album_art_only = true
hide_when_idle = true
hide_when_no_media = true
show_tooltip = false
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.tray]
icon_color = "#f2f2f2"
